<div class="call-graph-root">
  <div class="empty-state-box" *ngIf="!graph">
    No functions loaded yet.
  </div>
  <svg
    *ngIf="graph"
    class="call-graph-svg"
    [attr.viewBox]="'0 0 ' + graph.width + ' ' + graph.height"
    [attr.width]="graph.width"
    [attr.height]="graph.height"
  >
    <defs>
      <marker id="cg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" class="call-graph-arrowhead"></path>
      </marker>
    </defs>

    <path
      *ngFor="let edge of graph.edges"
      [attr.d]="edgePath(edge.from, edge.to)"
      class="call-graph-edge"
      marker-end="url(#cg-arrow)"
    ></path>

    <g
      *ngFor="let node of graph.nodes"
      class="call-graph-node"
      [class.call-graph-node-engine]="node.kind === 'engine'"
      [class.call-graph-node-orphan]="node.kind === 'orphan'"
      [attr.transform]="'translate(' + node.x + ',' + node.y + ')'"
      (click)="onNodeClick(node)"
    >
      <rect x="-70" y="-18" width="140" height="36" rx="6"></rect>
      <text x="0" y="5" text-anchor="middle">{{ node.label }}</text>
    </g>
  </svg>
</div>
