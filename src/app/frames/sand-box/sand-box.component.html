<div class="row dropShadowbottom">
  <p>RuleForge Lab</p>
  <p>{{Dev}}: <span style="font-weight: bolder;color: #f5550b;cursor: pointer;" (click)="logout()">Logout </span></p>
</div>
<hr class="hrgate2">

<div class="wrapper">
  <div class="container">
    <div class="card tabs">
      <input
        id="tab-1"
        type="radio"
        class="tab tab-selector"
        checked="checked"
        name="tab"
      />
      <label for="tab-1" class="tab tab-primary" (click)="changeTab('run')"
        >Rules Run
      </label>
      <input id="tab-2" type="radio" class="tab tab-selector" name="tab" />
      <label
        for="tab-2"
        class="tab tab-success"
        (click)="changeTab('audit')"
        *ngIf="jsonString"
        >Rules Audit
      </label>
      <label class="tab tab-disabled" *ngIf="!jsonString">Rules Audit </label>
      <div class="tabsShadow"></div>
      <section class="content">
        <div
          class="item2 col12"
          id="content-1"
          [ngClass]="{ 'hide-class': audit }"
          >
          <div class="col4" style="height: 40px">
            <button
              class="col4"
              (click)="triggerJsonFileInput()"
              *ngIf="!jsonData"
            >
              Load Rules
            </button>
            <button class="col4" (click)="reuploadFiles()" *ngIf="jsonData">
              <span style="color: white;">
                {{jsonFileName}}
              </span><br>
              Reupload Rules
            </button>
            <input
              type="file"
              (change)="loadJsonFile($event)"
              #jsonFileInput
              style="display: none" accept=".json"
            />
            <div class="json-toolbar">
              <button
                class="mode-btn"
                [class.mode-btn-active]="rulesViewMode === 'tree'"
                [disabled]="!jsonData"
                (click)="setRulesViewMode('tree')"
              >Tree View</button>
              <button
                class="mode-btn"
                [class.mode-btn-active]="rulesViewMode === 'edit'"
                [disabled]="!jsonData"
                (click)="setRulesViewMode('edit')"
              >Inline Edit</button>
              <button
                class="mode-btn"
                [class.mode-btn-active]="rulesViewMode === 'raw'"
                [disabled]="!jsonData"
                (click)="setRulesViewMode('raw')"
              >Raw Edit</button>
              <button class="mode-btn" [disabled]="!jsonData" (click)="downloadRulesJson()">Download</button>
            </div>
            <div class="pre codebg json-tree-container" *ngIf="jsonData && rulesViewMode === 'tree'">
              <ngx-json-viewer [json]="displayJsonData" [expanded]="false"></ngx-json-viewer>
            </div>
            <div class="pre codebg json-tree-container" *ngIf="jsonData && rulesViewMode === 'edit'">
              <button class="mode-btn mode-btn-active apply-btn" (click)="applyInlineEdits()">Apply Changes</button>
              <app-rules-tree-editor
                [rules]="rules"
                [functions]="functions"
                (rulesChange)="onRulesEdited($event)"
                (functionsChange)="onFunctionsEdited($event)"
              ></app-rules-tree-editor>
            </div>
            <div class="pre codebg json-tree-container" *ngIf="jsonData && rulesViewMode === 'raw'">
              <button class="mode-btn mode-btn-active apply-btn" (click)="applyRawJsonEdit()">Apply Changes</button>
              <textarea
                class="raw-json-textarea"
                [(ngModel)]="rawJsonEditText"
                rows="20"
                spellcheck="false"
              ></textarea>
            </div>
            <div class="pre codebg json-tree-container empty-state-box" *ngIf="!jsonData">
              No rules loaded yet — click Load Rules to get started.
            </div>
          </div>
          <div class="col4" style="height: 40px">
            <button
              class="col4"
              *ngIf="!xmlString"
              (click)="triggerXmlFileInput()"
            >
              Load Payload
            </button>
            <button
              class="col4"
              *ngIf="xmlString"
              (click)="triggerXmlFileInput()"
            >
              <span style="color: white;">
                {{xmlFileName}}
              </span><br>
              Reupload Payload
            </button>
            <div class="json-toolbar">
              <button class="mode-btn" [disabled]="!xmlString" (click)="downloadXmlPayload()">Download</button>
            </div>
            <div class="pre codebg xml-editor-container">
              <app-xml-code-editor
                [code]="xmlString"
                (codeChange)="xmlString = $event"
              ></app-xml-code-editor>
            </div>
            <button (click)="formatXml()" class="btn btn-secondary col4">
              Validate & Format XML
            </button>
            <input
              type="file"
              (change)="loadXmlFile($event)"
              #xmlFileInput
              style="display: none" accept=".xml"
            />
          </div>
          <div class="col4" style="height: 40px">
            <button class="col4" [disabled]="!jsonString || !xmlString" (click)="sendDataToRulesEngine()">Forge</button>

             
            <div class="pre codebg json-tree-container" *ngIf="resultData">
              <ngx-json-viewer [json]="resultData" [expanded]="false"></ngx-json-viewer>
            </div>
            <div class="pre codebg json-tree-container empty-state-box" *ngIf="!resultData">
              No results yet — click Load Rules and Payload then Forge to evaluate.
            </div>
             

             
          </div>
        </div>
             

        <div
          class="item2 col12"
          id="content-2"
          [ngClass]="{ 'hide-class': run }"
        >
          <div class="col4" style="height: 40px">
            <button class="col4 btndis">Functions</button>

            <div *ngIf="audit" class="function-audit-layout">
              <app-function-call-graph
                class="function-audit-graph-pane"
                [functions]="functions"
                (nodeClick)="scrollToFunctionCard($event)"
              ></app-function-call-graph>

              <div class="pretag function-audit-list function-audit-list-pane">
                <div class="function-audit-card" *ngFor="let card of functionCards" [id]="'function-card-' + card.name">
                  <div class="function-audit-header" (click)="toggleFunctionCard(card)">
                    <span class="function-audit-toggle">{{ card.expanded ? '▾' : '▸' }}</span>
                    <span class="function-audit-name">{{ card.name }}</span>
                    <button
                      type="button"
                      class="mode-btn function-audit-copy"
                      (click)="copyFunctionCode(card); $event.stopPropagation()"
                    >{{ card.copied ? 'Copied!' : (card.copyFailed ? 'Copy failed' : 'Copy') }}</button>
                  </div>
                  <pre *ngIf="card.expanded" class="function-audit-body"><code class="language-javascript" [innerHTML]="card.html"></code></pre>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<hr class="hrgate">
<div class="row botomLeftCorner">
  <p>V 1.2.0. By ASD &nbsp;&nbsp;&nbsp;</p><button (click)="toggleTheme()" class="btntoogle">
    <i class="fa fa-moon-o" aria-hidden="true"*ngIf="!isDarkMode"></i>
    <i class="fa fa-sun-o" aria-hidden="true"*ngIf="isDarkMode"></i>
  </button>
</div>

<ngx-spinner *ngIf="isDarkMode&&!MatrixRun"
  bdColor="rgb(15,23,42)"
  size="medium"
  color="#f59e0b"
  type="fire"
  [fullScreen]="true"
></ngx-spinner>
<ngx-spinner *ngIf="!isDarkMode&&!MatrixRun"
  bdColor="rgb(255, 255, 255)"
  size="medium"
  color="#f59e0b"
  type="fire"
  [fullScreen]="true"
></ngx-spinner>
<ngx-spinner *ngIf="MatrixRun"
  bdColor="rgb(15,23,42)"
  size="medium"
  color="#f59e0b"
  type="ball-clip-rotate-pulse"
  [fullScreen]="true"
></ngx-spinner>
